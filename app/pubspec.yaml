name: skidsense_app
description: "SkidSense — control the desktop agents from your phone."
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  skidsense_core:
    path: ../packages/skidsense_core

  # UI: the Material library as a package (the whole app imports it through
  # lib/ui/material.dart), plus the Expressive components it does not have.
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  material_3_expressive: ^1.1.5
  material_new_shapes: ^1.0.0
  dynamic_color: ^2.1.0
  intl: ^0.20.3

  # Platform.
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  app_links: ^7.2.2
  local_auth: ^3.0.2
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  connectivity_plus: ^7.3.2
  xterm: ^4.0.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  config:
    # iOS plugins through Swift Package Manager; no CocoaPods needed.
    enable-swift-package-manager: true
