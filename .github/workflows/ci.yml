name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  core:
    name: Core (protocol, transport, app state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: packages/skidsense_core
        run: dart analyze --fatal-infos
      - working-directory: packages/skidsense_core
        run: dart test --timeout 120s

  app:
    name: App (analyze, unit tests, goldens)
    # Goldens are drawn with macOS fonts; elsewhere they are skipped.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: app
        run: flutter analyze --fatal-infos
      - working-directory: app
        run: flutter test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/failures/

  android:
    name: Android build
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: skidsense-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS build (simulator)
    needs: app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build ios --simulator --debug
