name: CI

on:
  # Every push, on every branch.
  push:
    branches: ['**']
  # Pull requests from forks; a branch of this repository already runs on
  # its pushes (see the `if` on the first jobs).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a branch's run; on main every commit is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  core:
    name: Core (protocol, transport, app state)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: packages/skidsense_core
        run: dart analyze --fatal-infos
      - working-directory: packages/skidsense_core
        run: dart test --timeout 120s

  app:
    name: App (analyze, unit tests, goldens)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    # Goldens are drawn with macOS fonts; elsewhere they are skipped.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: app
        run: flutter analyze --fatal-infos
      - working-directory: app
        run: flutter test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/failures/
          if-no-files-found: ignore

  android:
    name: Android build
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: skidsense-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS build (simulator)
    needs: app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build ios --simulator --debug
